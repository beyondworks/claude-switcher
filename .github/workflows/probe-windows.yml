name: probe-windows
on:
  push:
    branches: [probe/windows]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Install Claude (exe, per-user) and wait for its self-update
        shell: pwsh
        run: |
          $u = "https://downloads.claude.ai/releases/win32/x64/1.44121.2/Claude-817a7b4563855a33d4b678faefc71f87554445d8.exe"
          Invoke-WebRequest $u -OutFile $env:RUNNER_TEMP\claude-setup.exe
          Start-Process $env:RUNNER_TEMP\claude-setup.exe -ArgumentList "--silent" -Wait
          Start-Sleep 120
          Get-Process | Where-Object { $_.Path -like "*AnthropicClaude*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep 5
          "== app folders"; Get-ChildItem "$env:LOCALAPPDATA\AnthropicClaude" -Directory | Select-Object Name | Out-String
      - name: Quit-related code in the app
        shell: pwsh
        run: |
          $asar = Get-ChildItem "$env:LOCALAPPDATA\AnthropicClaude" -Recurse -Filter app.asar | Sort-Object LastWriteTime | Select-Object -Last 1
          "asar: $($asar.FullName)"
          npx --yes @electron/asar extract $asar.FullName $env:RUNNER_TEMP\asar | Out-Null
          $js = Get-ChildItem $env:RUNNER_TEMP\asar\.vite\build -Filter *.js -Recurse
          function ctx($pat, $n, $w) { $js | Select-String -Pattern $pat -SimpleMatch | Select-Object -First $n | ForEach-Object { $l=$_.Line; $i=$l.IndexOf($pat); "--- $($_.Filename): " + $l.Substring([Math]::Max(0,$i-$w), [Math]::Min(2*$w, $l.Length-[Math]::Max(0,$i-$w))) } }
          foreach ($p in '"session-end"','"window-all-closed"','"before-quit"','argv.includes("--','"second-instance"') { "===== $p"; ctx $p 3 350 }
      - name: Stub forwards --user-data-dir?
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\cs\p3 | Out-Null
          Start-Process "$env:LOCALAPPDATA\AnthropicClaude\claude.exe" -ArgumentList "--user-data-dir=C:\cs\p3"
          Start-Sleep 40
          Get-CimInstance Win32_Process -Filter "Name='claude.exe'" | Where-Object { $_.CommandLine -notmatch "--type=" } | ForEach-Object { "  $($_.ProcessId) $($_.CommandLine)" }
      - name: Graceful quit candidates
        shell: pwsh
        run: |
          Add-Type @"
          using System; using System.Runtime.InteropServices; using System.Collections.Generic; using System.Text;
          public static class W {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern IntPtr SendMessageTimeout(IntPtr h, uint m, IntPtr w, IntPtr l, uint f, uint t, out IntPtr r);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
            public static List<IntPtr> Of(uint pid) { var a = new List<IntPtr>(); EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p); if (p == pid) a.Add(h); return true; }, IntPtr.Zero); return a; }
          }
          "@
          $log = "$env:LOCALAPPDATA\Claude\logs\main.log"
          $main = Get-CimInstance Win32_Process -Filter "Name='claude.exe'" | Where-Object { $_.CommandLine -match "p3" -and $_.CommandLine -notmatch "--type=" } | Select-Object -First 1
          "target pid $($main.ProcessId)"
          $before = (Get-Content $log).Count
          # WM_QUERYENDSESSION (0x11) then WM_ENDSESSION (0x16, wParam=1): what Windows sends at log-off
          foreach ($h in [W]::Of([uint32]$main.ProcessId)) { $r=[IntPtr]::Zero; [void][W]::SendMessageTimeout($h, 0x11, [IntPtr]::Zero, [IntPtr]::Zero, 2, 3000, [ref]$r); [void][W]::SendMessageTimeout($h, 0x16, [IntPtr]1, [IntPtr]::Zero, 2, 3000, [ref]$r) }
          Start-Sleep 20
          $alive = Get-Process -Id $main.ProcessId -ErrorAction SilentlyContinue
          "after WM_ENDSESSION: alive=$([bool]$alive)"
          "== new log lines"; Get-Content $log | Select-Object -Skip $before | Select-Object -First 40
