name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: Test and build
        run: |
          python3 -m unittest discover tests -v
          swiftc -O menubar/main.swift -o ClaudeSwitcher
      - name: Package
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="claude-switcher-$GITHUB_REF_NAME/" -o "dist/claude-switcher-$GITHUB_REF_NAME.tar.gz" HEAD
          (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Claude Switcher $GITHUB_REF_NAME" --generate-notes
